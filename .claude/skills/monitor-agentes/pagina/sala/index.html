<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de control · Órbita</title>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
<style>
@font-face { font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fuentes/geist-latin.woff2) format('woff2'); }
:root {
  --bg: #05080F; --vidrio: rgba(10, 15, 28, .72); --vidrio-fuerte: rgba(10, 15, 28, .9);
  --borde: rgba(148, 163, 184, .14); --borde-fuerte: rgba(148, 163, 184, .26);
  --texto: #E8EDF7; --cuerpo: #A9B4CB; --suave: #7E89A6; --tenue: #556079;
  --azul: #60A5FA; --ok: #34D399; --mal: #F87171; --aviso: #FBBF24;
  --fuente: 'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.contadores:empty { display: none; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--cuerpo); font: 14px/1.5 var(--fuente); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; border-radius: 8px; }
#lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.capa { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.capa > * { position: absolute; left: 0; top: 0; will-change: transform; }
.vidrio { background: var(--vidrio); border: 1px solid var(--borde); border-radius: 16px; backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); box-shadow: 0 10px 40px rgba(0,0,0,.35); }

/* ---------- Barra superior ---------- */
.barra { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; pointer-events: none; z-index: 20; }
.barra > * { pointer-events: auto; }
.marca { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-weight: 700; color: var(--texto); letter-spacing: -.01em; }
.marca small { font-weight: 500; color: var(--suave); }
.logo { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--azul); box-shadow: 0 0 12px var(--azul), inset 0 0 6px var(--azul); }
.vivo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--suave); margin-left: 4px; }
.vivo i { width: 7px; height: 7px; border-radius: 50%; background: var(--tenue); }
.vivo.on i { background: var(--ok); animation: pulso 1.8s infinite; }
.vivo.on { color: var(--ok); }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55); } 70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }
.sep { flex: 1; }
.contadores { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
.contador { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; color: var(--cuerpo); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); }
.contador b { color: var(--c); font-weight: 800; }
.boton { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 12px; font-weight: 600; font-size: 13px; color: var(--texto); text-decoration: none; cursor: pointer; transition: border-color .15s, background .15s; }
.boton:hover { border-color: var(--azul); background: rgba(96,165,250,.12); }
body[data-vista="oficina"] .solo-c, body[data-vista="constelacion"] .solo-o { display: none !important; }

/* ---------- Etiquetas 3D ---------- */
.etq-nucleo { text-align: center; color: var(--texto); }
.etq-nucleo b { display: block; font-size: 15px; letter-spacing: .02em; text-shadow: 0 0 14px rgba(96,165,250,.9); }
.etq-nucleo span { font-size: 11px; color: var(--suave); }
.etq-anillo { font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: #4B5B7E; white-space: nowrap; transform-origin: center; }
.etq-planeta { pointer-events: auto; cursor: pointer; border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); background: rgba(8, 12, 24, .7); backdrop-filter: blur(8px); border-radius: 10px; padding: 5px 10px 6px; text-align: left; white-space: nowrap; transition: border-color .15s, background .15s; }
.etq-planeta:hover { border-color: var(--c); background: rgba(8, 12, 24, .92); }
.etq-planeta .tit { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; color: var(--texto); }
.etq-planeta .sub { display: block; font-size: 11px; color: var(--c); margin-top: 1px; }
.etq-planeta .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.etq-planeta .punto.vivo { animation: pulso 1.6s infinite; }
.etq-planeta.est-pausa { opacity: .72; }

.etq-agente { pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; background: rgba(8, 12, 24, .62); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); border-radius: 10px; padding: 4px 10px 5px; max-width: 220px; text-align: center; backdrop-filter: blur(6px); transition: border-color .15s, background .15s, opacity .2s; }
.etq-agente:hover, .etq-agente.elegido { border-color: var(--c); background: rgba(8, 12, 24, .92); box-shadow: 0 0 20px color-mix(in srgb, var(--c) 35%, transparent); }
.etq-agente .nom { font-weight: 700; font-size: 12.5px; color: var(--texto); white-space: nowrap; }
.etq-agente .est { font-size: 11px; color: var(--suave); white-space: nowrap; }
.etq-agente .est.trabajando { color: var(--c); }
.etq-agente .est.trabajando::after { content: '…'; display: inline-block; width: 1em; text-align: left; animation: puntos 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
@keyframes puntos { from { width: 0; } to { width: 1em; } }
.etq-agente .est.ok { color: var(--ok); }
.etq-agente .est.mal { color: var(--mal); font-weight: 650; }
.etq-agente .motivo { font-size: 11px; line-height: 1.3; color: #FECACA; background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.3); border-radius: 7px; padding: 3px 7px; margin-top: 3px; white-space: normal; }
.etq-agente.fantasma { opacity: .45; }
.etq-agente.fantasma:hover { opacity: .9; }

.burbuja { pointer-events: none; max-width: 260px; background: rgba(12, 18, 34, .94); border: 1px solid var(--borde-fuerte); border-radius: 12px; padding: 8px 11px; color: var(--cuerpo); font-size: 12px; line-height: 1.4; box-shadow: 0 8px 30px rgba(0,0,0,.45); opacity: 0; transition: opacity .35s, margin .35s; margin-top: 8px; }
.burbuja.visible { opacity: 1; margin-top: 0; }
.burbuja .cab { display: flex; align-items: baseline; gap: 4px; color: var(--suave); font-size: 11px; white-space: nowrap; }
.burbuja .cab b { color: var(--texto); }
.burbuja .cab .cuando { margin-left: auto; padding-left: 8px; }
.burbuja p { margin: 4px 0 0; color: var(--texto); }
.burbuja .sello { display: inline-block; margin-top: 4px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 1px 7px; }
.burbuja.rechazo { border-color: rgba(248,113,113,.6); box-shadow: 0 0 26px rgba(248,113,113,.25); }
.burbuja.rechazo .sello { color: var(--mal); background: rgba(248,113,113,.14); }
.burbuja.aprueba { border-color: rgba(52,211,153,.55); }
.burbuja.aprueba .sello { color: var(--ok); background: rgba(52,211,153,.14); }

/* ---------- Paneles (feed / conversación) ---------- */
.panel { position: fixed; left: 16px; bottom: 44px; width: min(380px, calc(100vw - 32px)); max-height: 44vh; display: flex; flex-direction: column; z-index: 15; }
.panel h2 { margin: 0; padding: 12px 14px 8px; font-size: 11.5px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); display: flex; align-items: center; gap: 8px; }
.panel .lista-feed { overflow-y: auto; padding: 0 6px 8px; }
.plegar { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; }
.plegar::after { content: '▾'; margin-left: auto; font-size: 12px; transition: transform .2s; }
.plegar:focus-visible { outline: 2px solid var(--azul); outline-offset: 4px; border-radius: 6px; }
.panel.plegado .lista-feed { display: none; }
.panel.plegado .plegar::after { transform: rotate(-90deg); }
.panel.plegado h2 { padding-bottom: 12px; }
.feed-item { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 7px 8px; cursor: pointer; }
.feed-item:hover { background: rgba(148,163,184,.08); }
.feed-item .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 6px; box-shadow: 0 0 8px var(--c); }
.feed-item .tx { color: var(--cuerpo); font-size: 12.5px; line-height: 1.4; }
.feed-item .tx b { color: var(--texto); }
.feed-item .motivo { display: block; color: var(--suave); font-size: 11.5px; margin-top: 2px; }
.feed-item.mal .motivo { color: #FCA5A5; }
.feed-item.mal .tx { color: #FECACA; }
.feed-item.ok .tx { color: #A7F3D0; }
.feed-item .cuando { font-size: 11px; color: var(--tenue); white-space: nowrap; margin-top: 2px; }
.nada { padding: 6px 10px; color: var(--suave); font-size: 12.5px; }

/* ---------- HUD de la oficina ---------- */
.o-cab { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 15; width: min(720px, calc(100vw - 32px)); pointer-events: none; }
.o-cab > * { pointer-events: auto; }
.o-tarjeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; justify-content: center; }
.o-tarjeta h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; color: var(--texto); font-weight: 800; }
.chip-estado { font-size: 12px; font-weight: 700; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); padding: 2px 10px; border-radius: 999px; }
.o-etapa { font-size: 12.5px; color: var(--suave); }
.o-pasos { display: flex; gap: 4px; width: 100%; }
.o-pasos .paso { flex: 1; height: 4px; border-radius: 4px; background: rgba(148,163,184,.18); }
.o-pasos .paso.hecho { background: var(--azul); opacity: .7; }
.o-pasos .paso.ahora { background: var(--azul); box-shadow: 0 0 10px var(--azul); }
.o-motivo { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 9%, rgba(10,15,28,.85)); }
.o-motivo .tx { display: flex; flex-direction: column; gap: 1px; font-size: 13px; }
.o-motivo .rot { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.o-motivo b { color: var(--texto); }
.o-motivo .cita { color: var(--cuerpo); }
.enlace { background: none; border: 0; color: var(--azul); font-weight: 650; cursor: pointer; padding: 4px 0; white-space: nowrap; }
.enlace:hover { text-decoration: underline; }

/* ---------- Ficha del agente ---------- */
#ficha { position: fixed; top: 74px; right: 16px; bottom: 16px; width: min(460px, calc(100vw - 32px)); z-index: 25; display: flex; flex-direction: column; padding: 16px 0 0; transform: translateX(calc(100% + 24px)); transition: transform .35s cubic-bezier(.2,.8,.2,1); background: var(--vidrio-fuerte); }
#ficha.abierta { transform: none; }
.ficha-cab { display: flex; align-items: center; gap: 12px; padding: 0 18px; }
.ficha-cab .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: var(--c); border: 2px solid var(--c); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); flex: none; }
.ficha-tit { flex: 1; min-width: 0; }
.ficha-tit h2 { margin: 0; font-size: 17px; color: var(--texto); letter-spacing: -.01em; }
.ficha-tit p { margin: 0; font-size: 12.5px; color: var(--suave); }
.cerrar { width: 32px; height: 32px; border-radius: 10px; background: none; border: 1px solid var(--borde-fuerte); cursor: pointer; font-size: 18px; line-height: 1; }
.cerrar:hover { border-color: var(--azul); }
.ficha-cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; padding: 14px 18px 0; }
.ficha-cifras .cifra { border: 1px solid var(--borde); border-radius: 12px; padding: 8px 10px; }
.ficha-cifras b { display: block; font-size: 19px; color: var(--texto); letter-spacing: -.02em; }
.ficha-cifras span { font-size: 11.5px; color: var(--suave); }
.ficha-cifras .mal b { color: var(--mal); }
.ficha-cifras .ok b { color: var(--ok); }
.ficha-ahora { margin: 12px 18px 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--borde); font-size: 13px; }
.ficha-ahora .est { font-weight: 700; color: var(--texto); }
.ficha-ahora .est.trabajando { color: var(--c); }
.ficha-ahora .est.ok { color: var(--ok); }
.ficha-ahora .est.mal { color: var(--mal); }
.ficha-ahora.mal { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.07); }
.ficha-ahora p { margin: 4px 0 0; color: #FECACA; }
.ficha-filtros { display: flex; gap: 6px; padding: 12px 18px 8px; flex-wrap: wrap; }
.pildora { border: 1px solid var(--borde-fuerte); background: none; border-radius: 999px; padding: 3px 12px; font-size: 12px; cursor: pointer; color: var(--cuerpo); }
.pildora[aria-pressed="true"] { border-color: var(--c); color: var(--texto); background: color-mix(in srgb, var(--c) 14%, transparent); }
.lista { flex: 1; overflow-y: auto; padding: 4px 18px 18px; }
.item { position: relative; border-left: 2px solid var(--borde-fuerte); padding: 2px 0 14px 14px; }
.item::before { content: ''; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--borde-fuerte); }
.item.mal { border-left-color: rgba(248,113,113,.55); } .item.mal::before { border-color: var(--mal); background: var(--mal); }
.item.ok { border-left-color: rgba(52,211,153,.5); } .item.ok::before { border-color: var(--ok); background: var(--ok); }
.item.recibe::before { border-color: var(--c); }
.item .fila { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.item.mal .tipo { color: var(--mal); } .item.ok .tipo { color: var(--ok); } .item.recibe .tipo { color: var(--c); }
.item .cuando { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--tenue); white-space: nowrap; }
.item h3 { margin: 3px 0 0; font-size: 13.5px; color: var(--texto); }
.item .dicho { margin: 4px 0 0; font-size: 13px; color: var(--cuerpo); }
.por-que { margin-top: 6px; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: #FEE2E2; }
.por-que .rot { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mal); }
.por-que ul { margin: 4px 0 0; padding-left: 18px; } .por-que li + li { margin-top: 3px; }
.por-que p { margin: 4px 0 0; }
.despues { margin: 6px 0 0; font-size: 12.5px; color: var(--suave); }
.despues::before { content: '↳ '; }
.pie { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; }
.chip { font-size: 11.5px; color: var(--suave); border: 1px solid var(--borde); border-radius: 999px; padding: 1px 9px; }
.completo summary { cursor: pointer; color: var(--azul); font-size: 12.5px; font-weight: 600; }
.completo pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); color: var(--cuerpo); background: rgba(0,0,0,.3); border: 1px solid var(--borde); border-radius: 10px; padding: 10px; max-height: 340px; overflow: auto; margin: 6px 0 0; }
.ficha-vacia { padding: 14px 18px; color: var(--suave); }

/* ---------- Tooltip, velo, ayuda ---------- */
#tip { position: fixed; z-index: 40; max-width: 320px; pointer-events: none; }
.tip-video { padding: 12px 14px; border-radius: 14px; background: var(--vidrio-fuerte); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 30px color-mix(in srgb, var(--c) 18%, transparent); backdrop-filter: blur(12px); font-size: 12.5px; }
.tip-video > b { font-size: 15px; color: var(--texto); }
.tip-linea { color: var(--suave); }
.tip-estado { color: var(--c); font-weight: 700; margin-top: 4px; }
.tip-motivo { margin-top: 6px; padding: 7px 9px; border-radius: 9px; background: rgba(248,113,113,.09); border: 1px solid rgba(248,113,113,.28); }
.tip-motivo .quien { display: block; color: #FECACA; font-weight: 650; }
.tip-motivo .por { display: block; color: var(--cuerpo); margin-top: 2px; }
.tip-pie { margin-top: 6px; color: var(--suave); font-size: 11.5px; }
.tip-accion { margin-top: 6px; color: var(--azul); font-weight: 650; }
#velo { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, #0B1530, #05080F 70%); opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 30; }
#velo.on { opacity: 1; }
#ayuda { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 11.5px; color: var(--tenue); z-index: 10; text-align: center; width: calc(100vw - 32px); pointer-events: none; }
.aviso-centro { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; text-align: center; padding: 24px; }
.aviso-centro div { max-width: 460px; padding: 22px; }
.aviso-centro a { color: var(--azul); }

/* ---------- Lector de documentos ---------- */
dialog { width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--borde-fuerte); border-radius: 18px; padding: 0; background: #0B101D; color: var(--cuerpo); }
dialog::backdrop { background: rgba(2, 4, 10, .7); backdrop-filter: blur(4px); }
.dialogo-cab { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--borde); position: sticky; top: 0; background: #0B101D; }
.dialogo-cab h2 { margin: 0; flex: 1; font-size: 16px; color: var(--texto); }
#lector { padding: 6px 22px 22px; font-size: 14px; }
#lector h3, #lector h4, #lector h5 { color: var(--texto); margin: 18px 0 6px; }
#lector pre { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); background: rgba(0,0,0,.3); padding: 10px; border-radius: 10px; }
#lector code { font-family: var(--mono); font-size: 12.5px; color: #BFDBFE; }
#lector table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
#lector th, #lector td { border: 1px solid var(--borde); padding: 5px 8px; text-align: left; vertical-align: top; }
#lector strong { color: var(--texto); }

@media (max-width: 760px) {
  .marca small, .contadores { display: none; }
  .o-cab { top: 66px; }
  .panel { max-height: 30vh; bottom: 36px; }
  #ficha { top: 66px; left: 16px; width: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body data-vista="constelacion">
<canvas id="lienzo" aria-label="Vista 3D de los videos y sus agentes"></canvas>
<div id="capa-c" class="capa"></div>
<div id="capa-o" class="capa" hidden></div>

<header class="barra">
  <div class="marca vidrio"><span class="logo" aria-hidden="true"></span>Órbita <small>Sala de control</small>
    <span id="vivo" class="vivo" role="status"><i></i><span id="vivo-t">Conectando…</span></span></div>
  <button id="volver" class="boton vidrio solo-o" type="button">← Todos los videos</button>
  <span class="sep"></span>
  <div id="contadores" class="contadores vidrio solo-c" aria-label="Estado de los videos"></div>
  <a class="boton vidrio" href="/clasica" title="La vista anterior, en formato lista">Vista clásica</a>
</header>

<section class="panel vidrio solo-c" aria-label="Actividad reciente de todos los videos">
  <h2><button class="plegar" type="button" aria-expanded="true">Actividad de todos los videos</button></h2>
  <div id="feed-lista" class="lista-feed"></div>
</section>

<section class="o-cab solo-o" aria-live="polite">
  <div class="o-tarjeta vidrio">
    <h1 id="o-titulo"></h1>
    <span id="o-estado" class="chip-estado"></span>
    <span id="o-etapa" class="o-etapa"></span>
    <div id="o-pasos" class="o-pasos" aria-hidden="true"></div>
  </div>
  <div id="o-motivo" class="o-motivo vidrio" hidden></div>
</section>

<section class="panel vidrio solo-o" aria-label="Conversación de este video">
  <h2><button class="plegar" type="button" aria-expanded="true">Conversación de este video</button></h2>
